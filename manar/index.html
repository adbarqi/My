<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manar Alshreef | منار الشريف</title>
<meta name="description" content="Import Operations · DHL Saudi Arabia · Jeddah — performance portfolio 2025–2026">
<meta property="og:title" content="Manar Alshreef | منار الشريف">
<meta property="og:description" content="Import Operations · DHL Saudi Arabia · Jeddah">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F3EC;--sheet:#FFFFFF;--ink:#121212;--ink2:#1c1c1c;--muted:#66625a;--rule:#DCD8CC;
  --red:#D40511;--red-soft:#FBE3E5;--y:#FFCC00;--y-soft:#FFF3C2;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
button{font-family:inherit;color:inherit}
bdi{unicode-bidi:isolate}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}

/* ---------- HERO ---------- */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden;padding-bottom:64px}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000 40%,transparent)}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:#bdb9ae;display:flex;align-items:center;gap:9px}
[dir=rtl] .tag{font-family:var(--body);letter-spacing:0;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--y);box-shadow:0 0 0 4px rgba(255,204,0,.2);animation:pulse 2.4s ease-in-out infinite;flex:none}
.tr{display:flex;align-items:center;gap:16px}
.wm{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-style:italic;color:var(--red);background:var(--y);padding:4px 10px 3px;border-radius:4px;font-size:18px;letter-spacing:-.04em;line-height:1}
.lang{display:flex;border:1px solid #3a3a3a;border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:#aaa}
.lang button[aria-pressed=true]{background:var(--y);color:var(--ink)}
.hgrid{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:48px;align-items:center;padding-top:38px}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--y)}
[dir=rtl] .eyebrow{font-family:var(--body);letter-spacing:0;font-size:14px}
h1{font-size:clamp(52px,9vw,104px);font-weight:700;line-height:.98;letter-spacing:-.03em;margin:14px 0 20px}
[dir=rtl] h1{letter-spacing:0;line-height:1.15}
h1 .ln{display:block;overflow:hidden}
h1 .ln span{display:inline-block;transform:translateY(105%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
h1 .ln:nth-child(2) span{animation-delay:.12s}
h1 .y{color:var(--y)}
.lede{font-size:clamp(17px,2vw,20px);color:#d9d6ce;max-width:34em;opacity:0;animation:fade .8s .45s forwards}
.lede b{color:#fff;background:var(--red);padding:0 6px;border-radius:4px;font-weight:700}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:30px;border-top:1px solid #333;opacity:0;animation:fade .8s .6s forwards}
.facts div{padding:12px 12px 0 0;min-width:0}
[dir=rtl] .facts div{padding:12px 0 0 12px}
.facts dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8d897f}
[dir=rtl] .facts dt{font-family:var(--body);letter-spacing:0;font-size:12px}
.facts dd{font-weight:500;font-size:14.5px;margin-top:2px}

/* shipping label */
.label{background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 30px 70px rgba(0,0,0,.55);transform:rotate(-2.5deg);position:relative;overflow:hidden;opacity:0;animation:drop 1s .35s cubic-bezier(.2,.9,.25,1.15) forwards}
[dir=rtl] .label{transform:rotate(2.5deg)}
.label .lh{background:var(--y);display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.label .lh .wm{background:none;padding:0;font-size:26px}
.label .lh .svc{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.08em;text-align:end}
[dir=rtl] .label .lh .svc{font-family:var(--body);letter-spacing:0;font-size:13px}
.lrow{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid var(--ink)}
.lrow>div{padding:10px 16px;min-width:0}
.lrow>div+div{border-inline-start:1.5px solid var(--ink)}
.lk{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);display:block}
[dir=rtl] .lk{font-family:var(--body);letter-spacing:0;font-size:11px}
.lv{font-weight:700;font-size:14.5px;line-height:1.35;display:block;margin-top:1px}
.lfull{padding:12px 16px 16px}
.lfull .lv{font-weight:500;font-size:13.5px}
.bc{padding:12px 16px 10px;display:grid;gap:4px}
.bc svg{width:100%;height:54px;display:block}
.bc .num{font-family:var(--mono);font-size:11.5px;letter-spacing:.3em;text-align:center;direction:ltr}
.stamp{position:absolute;inset-inline-end:18px;bottom:30px;border:3px solid var(--red);color:var(--red);font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.12em;padding:4px 10px;border-radius:6px;transform:rotate(-14deg) scale(2.2);opacity:0;animation:stamp .45s 1.5s cubic-bezier(.3,1.6,.5,1) forwards;background:rgba(255,255,255,.85);text-align:center;line-height:1.25}
[dir=rtl] .stamp{font-family:var(--body);letter-spacing:0;font-size:14px}

/* marquee */
.marquee{background:var(--y);color:var(--ink);overflow:hidden;border-block:2px solid var(--ink);direction:ltr}
.mtrack{display:flex;width:max-content;animation:scroll 32s linear infinite}
.mtrack span{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.06em;padding:13px 0;white-space:nowrap;display:flex;align-items:center}
.mtrack span::after{content:"";width:9px;height:9px;background:var(--red);transform:rotate(45deg);margin-inline:28px}

/* sections */
section{padding-block:72px 20px}
.sh{display:grid;gap:8px;margin-bottom:30px;max-width:46em}
.sh .k{font-family:var(--mono);font-size:12px;color:var(--red);letter-spacing:.1em;display:flex;align-items:center;gap:10px}
.sh .k::before{content:"";width:26px;height:2px;background:var(--red)}
.sh h2{font-size:clamp(28px,4.2vw,44px);font-weight:700;line-height:1.15;letter-spacing:-.01em}
[dir=rtl] .sh h2{letter-spacing:0;line-height:1.35}
.sh p{color:var(--muted);font-size:16.5px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:20px 18px 18px;display:grid;gap:8px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
.stat.hl{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat .n{font-family:var(--mono);font-weight:600;font-size:clamp(34px,4.4vw,50px);line-height:1;direction:ltr;unicode-bidi:isolate;letter-spacing:-.02em}
[dir=rtl] .stat .n{text-align:right}
.stat .n i{font-style:normal;color:var(--red)}
.stat.hl .n{color:var(--y)}
.stat.hl .n i{color:var(--y)}
.stat .l{font-size:13.5px;color:var(--muted);line-height:1.45}
.stat.hl .l{color:#c9c5bb}
.stat .bar{height:4px;border-radius:2px;background:#ece9e0;overflow:hidden;margin-top:auto}
.stat.hl .bar{background:#333}
.stat .bar i{display:block;height:100%;width:0;background:var(--red);transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.stat.hl .bar i{background:var(--y)}

/* route */
.route{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;list-style:none;--p:1}
.route::before,.route::after{content:"";position:absolute;top:27px;height:4px;border-radius:2px;inset-inline-start:12.5%}
.route::before{width:75%;background:repeating-linear-gradient(90deg,#c8c3b5 0 8px,transparent 8px 14px)}
.route::after{width:calc(75% * var(--p));background:var(--red);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.plane{position:absolute;top:13px;inset-inline-start:calc(12.5% + 75% * var(--p) - 16px);width:32px;height:32px;z-index:3;transition:inset-inline-start .9s cubic-bezier(.2,.8,.2,1);pointer-events:none;display:none}
.node{display:grid;justify-items:center;text-align:center;gap:6px;position:relative;z-index:2}
.node button{width:58px;height:58px;border-radius:50%;border:3px solid #c8c3b5;background:var(--paper);cursor:pointer;display:grid;place-items:center;transition:all .35s}
.node button svg{width:24px;height:24px;color:#a19b8b;transition:color .35s}
.node.past button{border-color:var(--red);background:var(--sheet)}
.node.past button svg{color:var(--red)}
.node.cur button{background:var(--red);border-color:var(--red);transform:scale(1.12);box-shadow:0 0 0 8px var(--red-soft)}
.node.cur button svg{color:#fff}
.node.live.cur button{background:var(--y);border-color:var(--ink);box-shadow:0 0 0 8px var(--y-soft)}
.node.live.cur button svg{color:var(--ink)}
.node .d{font-family:var(--mono);font-size:12px;color:var(--red);direction:ltr;margin-top:6px}
.node .t{font-weight:700;font-size:15.5px;line-height:1.35}
.rdetail{margin-top:30px;background:var(--ink);color:#fff;border-radius:18px;padding:26px 28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;min-height:150px}
.rdetail .big{font-family:var(--mono);font-weight:600;font-size:clamp(40px,6vw,64px);color:var(--y);line-height:1;direction:ltr}
.rdetail .k{font-family:var(--mono);font-size:11.5px;color:#9a968c;letter-spacing:.1em;direction:ltr;text-align:start;display:block}
.rdetail h3{font-size:20px;font-weight:700;margin:4px 0 6px}
.rdetail p{color:#cfcbc2;max-width:46em}
.rdetail.swap{animation:swap .5s}

/* incoterms */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;overflow:hidden}
.pb{padding:24px}
.terms{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:7px;direction:ltr}
.terms button{border:1.5px dashed #b9b4a6;background:transparent;border-radius:10px;padding:11px 0;font-family:var(--mono);font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);transition:transform .2s,box-shadow .2s}
.terms button:hover{transform:translateY(-2px)}
.terms button.on{border:1.5px solid var(--red);background:var(--red);color:#fff}
.terms button[aria-pressed=true]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink);transform:translateY(-2px)}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:6px}
.thead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:26px}
.thead .code{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em}
.pill{font-size:12.5px;font-weight:500;padding:3px 12px;border-radius:999px;background:var(--red-soft);color:var(--red)}
.pill.no{background:#eeebe2;color:var(--muted)}
.mode{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
[dir=rtl] .mode{font-family:var(--body);font-size:12.5px}
.desc{color:var(--muted);max-width:52em;font-size:15.5px;margin-top:8px}
.journey{margin-top:22px;position:relative}
.jicons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.jicons div{display:grid;justify-items:center;gap:6px;text-align:center;padding:0 4px}
.jicons svg{width:34px;height:34px;color:var(--ink)}
.jicons span{font-size:12.5px;color:var(--muted);line-height:1.3}
.track{position:relative;margin-top:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.track div{height:46px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;transition:background .5s,color .5s}
[dir=rtl] .track div{font-family:var(--body);letter-spacing:0;font-size:13px}
.track .s{background:var(--ink);color:var(--y)}
.track .b{background:var(--y-soft);color:var(--ink);box-shadow:inset 0 0 0 1px #efd98a}
.box{position:absolute;top:-30px;left:0;width:26px;height:22px;background:#b88a4a;border-radius:3px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);animation:ship 6s linear infinite}
.box::after{content:"";position:absolute;inset:0 10px;background:#d8b07a}
.risk{position:absolute;top:-8px;bottom:-8px;width:0;border-inline-start:3px solid var(--red);transition:inset-inline-start .7s cubic-bezier(.2,.8,.2,1)}
.risk span{position:absolute;bottom:-26px;inset-inline-start:0;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:700;color:var(--red);background:var(--sheet);padding:0 6px}
.risk::before{content:"";position:absolute;top:-6px;inset-inline-start:-7px;width:11px;height:11px;border-radius:50%;background:var(--red)}
.jleg{display:flex;gap:18px;margin-top:40px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.jleg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:6px}

/* accounts */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.acc{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;padding:26px;display:grid;gap:12px;align-content:start;position:relative;overflow:hidden}
.acc.dark{background:var(--red);color:#fff;border-color:var(--red)}
.acc .ic{width:46px;height:46px;border-radius:12px;background:var(--y);display:grid;place-items:center}
.acc .ic svg{width:24px;height:24px}
.acc h3{font-size:22px;font-weight:700;line-height:1.3}
.acc p{color:var(--muted);font-size:15.5px}
.acc.dark p{color:#ffd9dc}
.acc ul{list-style:none;display:grid;gap:8px;font-size:15px}
.acc li{display:flex;gap:10px}
.acc li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--red);margin-top:10px}
.acc.dark li::before{background:var(--y)}
.acc .ghost{position:absolute;inset-inline-end:-10px;bottom:-26px;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-style:italic;font-size:120px;letter-spacing:-.05em;color:rgba(0,0,0,.04);line-height:1;pointer-events:none;direction:ltr}
.acc.dark .ghost{color:rgba(255,255,255,.08)}

/* 2027 */
.next{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.nx{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:22px 20px;display:grid;gap:8px;align-content:start;position:relative;overflow:hidden;transition:transform .3s,background .3s,color .3s}
.nx:hover{transform:translateY(-6px);background:var(--ink);color:#fff}
.nx:hover p{color:#c9c5bb}
.nx .no{font-family:var(--mono);font-size:42px;font-weight:600;color:var(--y);line-height:1;-webkit-text-stroke:1.5px var(--ink)}
.nx:hover .no{-webkit-text-stroke:0}
.nx .ic{width:30px;height:30px;color:var(--red)}
.nx h3{font-size:18px;font-weight:700;line-height:1.3}
.nx p{font-size:14.5px;color:var(--muted);transition:color .3s}
.support{margin-top:18px;background:var(--y);border-radius:18px;padding:20px 24px;display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:20px;align-items:center}
.support .k{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--red);max-width:9em;line-height:1.4}
[dir=rtl] .support .k{font-family:var(--body);letter-spacing:0;font-size:13.5px}
.support div{font-weight:500;font-size:15px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.support div::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;font-size:12px;margin-top:1px}

/* footer */
footer{margin-top:80px;background:var(--ink);color:#fff;position:relative;overflow:hidden}
.fin{position:relative;padding-block:70px 34px;display:grid;gap:16px}
footer .k{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;color:var(--y)}
[dir=rtl] footer .k{font-family:var(--body);letter-spacing:0;font-size:14px}
footer h2{font-size:clamp(32px,5.5vw,62px);font-weight:700;line-height:1.1;max-width:15em;letter-spacing:-.02em}
[dir=rtl] footer h2{letter-spacing:0;line-height:1.35}
footer h2 em{font-style:normal;color:var(--y)}
footer p{color:#bdb9ae;max-width:40em;font-size:17px}
.road{position:relative;height:90px;margin-top:20px;border-bottom:3px dashed #3a3a3a}
.truck{position:absolute;bottom:4px;left:-170px;width:160px;animation:drive 9s linear infinite}
.note{font-size:12.5px;color:#8d897f;border-top:1px solid #2c2c2c;padding-top:16px;margin-top:18px}

@keyframes pulse{50%{box-shadow:0 0 0 9px transparent;opacity:.7}}
@keyframes rise{to{transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(-8deg)}to{opacity:1}}
@keyframes stamp{to{opacity:1;transform:rotate(-14deg) scale(1)}}
@keyframes scroll{to{transform:translateX(-50%)}}
@keyframes swap{from{opacity:.2;transform:translateY(8px)}}
@keyframes ship{0%{left:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{left:calc(100% - 26px);opacity:0}}
@keyframes drive{to{left:100%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.rv,.lede,.facts,.label,.stamp{opacity:1!important;transform:none!important}h1 .ln span{transform:none}}

@media (max-width:900px){
  .hgrid{grid-template-columns:minmax(0,1fr);gap:40px}
  .label{max-width:420px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats .stat:first-child{grid-column:span 2}
  .next{grid-template-columns:repeat(2,minmax(0,1fr))}
  .terms{grid-template-columns:repeat(6,minmax(0,1fr))}
  .support{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .wrap{padding-inline:18px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:6px}
  .two{grid-template-columns:minmax(0,1fr)}
  .route{grid-template-columns:minmax(0,1fr);gap:22px}
  .route::before,.route::after{top:12px;inset-inline-start:27px;width:4px}
  .route::before{height:calc(100% - 24px);background:repeating-linear-gradient(180deg,#c8c3b5 0 8px,transparent 8px 14px)}
  .route::after{height:calc((100% - 24px) * var(--p))}
  .node{grid-template-columns:58px minmax(0,1fr);justify-items:start;text-align:start;column-gap:16px;row-gap:0;align-items:center}
  .node button{grid-row:span 2}
  .node .d{margin-top:0}
  .rdetail{grid-template-columns:minmax(0,1fr);gap:10px;padding:22px}
  .jicons span{font-size:11px}
  .jicons svg{width:26px;height:26px}
  .track div{height:38px;font-size:10px;letter-spacing:.02em}
  [dir=rtl] .track div{font-size:11px}
  .risk span{font-size:10.5px}
  .pb{padding:18px}
}
@media (max-width:480px){
  .next{grid-template-columns:minmax(0,1fr)}
  .terms{grid-template-columns:repeat(4,minmax(0,1fr))}
  h1{font-size:54px}
  .label{transform:rotate(-1.5deg)}
}
</style>
</head>
<body>

<header class="hero">
  <svg class="bg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <path id="a1" d="M-50 560 C 250 260, 700 160, 1250 260"/>
      <path id="a2" d="M-50 420 C 300 520, 800 120, 1250 120"/>

const NICON=['<path d="M12 3l10 18H2z M12 10v5 M12 17.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
'<path d="M7 8h10l3 13H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="5.5" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/>',
'<rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 7V5h6v2 M3 12h18" fill="none" stroke="currentColor" stroke-width="2"/>',
'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.7"/>'];
let lang="en",sel=3,term="DDP",counted=false;
const $=id=>document.getElementById(id);

// barcode
false&&(function(){let x=0,s=7,h="";while(x<296){s=(s*9301+49297)%233280;const w=1+Math.floor(s/233280*4);if(Math.floor(s/7)%2)h+='<rect x="'+x+'" y="0" width="'+w+'" height="54" fill="#121212"/>';x+=w+1}$("barcode").innerHTML=h})();

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>{const v=t[el.dataset.i];if(v===undefined)return;
    el.innerHTML=Array.isArray(v)?v.map(x=>"<li>"+x+"</li>").join(""):v;});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("name").innerHTML='<span class="ln"><span>'+t.name[0]+'</span></span><span class="ln"><span>'+t.name[1]+'<span class="y">.</span></span></span>';
  const m=T.en.mq.map(x=>"<span>"+x+"</span>").join("");$("mq").innerHTML=m+m;
  $("stats").innerHTML=t.stats.map((s,i)=>'<div class="stat rv'+(i===0?' hl':'')+(document.querySelector("#stats .in")?' in':'')+'"><span class="n"><span class="cnt" data-v="'+s[0]+'">'+(counted?s[0]:0)+'</span><i>'+s[1]+'</i></span><span class="l">'+s[2]+'</span><span class="bar"><i style="width:'+(counted?s[3]*100:0)+'%" data-w="'+s[3]*100+'"></i></span></div>').join("");
  drawRoute();drawTerm();
  $("nextList").innerHTML=t.next.map((n,i)=>'<div class="nx rv'+(counted?' in':'')+'"><span class="no">0'+(i+1)+'</span><svg class="ic" viewBox="0 0 24 24">'+NICON[i]+'</svg><h3>'+n[0]+'</h3><p>'+n[1]+'</p></div>').join("");
  $("support").innerHTML='<span class="k">'+t.supK+'</span>'+t.support.map(s=>'<div>'+s+'</div>').join("");
  observe();
}
function drawRoute(anim){
  const t=T[lang];
  $("routeList").style.setProperty("--p",sel/3);
  $("routeList").innerHTML=t.route.map((r,i)=>'<li class="node'+(i===3?' live':'')+(i<sel?' past':'')+(i===sel?' cur past':'')+'"><button aria-pressed="'+(i===sel)+'" data-r="'+i+'" aria-label="'+r.d+'"><svg viewBox="0 0 24 24">'+RICON[i]+'</svg></button><span class="d">'+r.d+'</span><span class="t">'+r.t+'</span></li>').join("");
  const r=t.route[sel],d=$("rdetail");
  d.innerHTML='<span class="big">'+r.big+'</span><div><span class="k">'+r.k+'</span><h3>'+r.h+'</h3><p>'+r.p+'</p></div>';
  if(anim){d.classList.remove("swap");void d.offsetWidth;d.classList.add("swap")}
  $("routeList").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=+b.dataset.r;drawRoute(true)});
}
function drawTerm(){
  const t=T[lang];
  $("terms").innerHTML=TERMS.map(c=>'<button class="'+(DONE.has(c)?"on":"")+'" aria-pressed="'+(c===term)+'" data-t="'+c+'">'+c+'</button>').join("");
  $("terms").querySelectorAll("button").forEach(b=>b.onclick=()=>{term=b.dataset.t;drawTerm()});
  $("tdet").innerHTML='<div class="thead"><span class="code">'+term+'</span><span class="pill'+(DONE.has(term)?'':' no')+'">'+(DONE.has(term)?t.done:t.todo)+'</span><span class="mode">'+t.anyMode+'</span></div><p class="desc">'+t.desc[term]+'</p>';
  $("jicons").innerHTML=t.stages.map((s,i)=>'<div><svg viewBox="0 0 24 24">'+JICON[i]+'</svg><span>'+s+'</span></div>').join("");
  const sp=SPLIT[term],tr=$("track");
  let cells=tr.querySelectorAll(".cell");
  if(!cells.length){tr.insertAdjacentHTML("beforeend",[0,1,2,3,4].map(()=>'<div class="cell"></div>').join("")+'<div class="risk"><span></span></div>');cells=tr.querySelectorAll(".cell")}
  cells.forEach((c,i)=>{c.className="cell "+(sp[i]==="S"?"s":"b");c.textContent=sp[i]==="S"?t.seller:t.buyer});
  const rk=tr.querySelector(".risk");rk.style.insetInlineStart=(RISK[term]/5*100)+"%";rk.querySelector("span").textContent=t.risk;
  const sx=RISK[term]===0?"translateX(0)":(lang==="ar"?"translateX(50%)":"translateX(-50%)");rk.querySelector("span").style.transform=sx;
}
function count(){
  if(counted)return;counted=true;
  document.querySelectorAll(".cnt").forEach(el=>{const v=+el.dataset.v,st=performance.now(),D=1600;
    (function f(n){const p=Math.min(1,(n-st)/D),e=1-Math.pow(1-p,3);el.textContent=Math.round(v*e);if(p<1)requestAnimationFrame(f)})(st)});
  document.querySelectorAll(".stat .bar i").forEach(b=>b.style.width=b.dataset.w+"%");
}
let io;
function observe(){
  if(!("IntersectionObserver" in window)){document.querySelectorAll(".rv").forEach(e=>e.classList.add("in"));count();return}
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");if(e.target.closest("#stats"))count();io.unobserve(e.target)}}),{threshold:.15});
  document.querySelectorAll(".rv:not(.in)").forEach((e,i)=>{if(e.parentElement.id==="stats"||e.parentElement.id==="nextList")e.style.transitionDelay=(Array.from(e.parentElement.children).indexOf(e)*90)+"ms";io.observe(e)});
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("ml-lang",lang)}catch(e){}render()});
try{const s=localStorage.getItem("ml-lang");if(s&&T[s])lang=s}catch(e){}
render();
</script>
</body>
</html>
