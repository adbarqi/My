<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0C22">
<title>ليلة التحدي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --stage:#0A0C22;--panel:#161B44;--panel2:#1E2458;--line:#2C3470;
  --ink:#F4F1FF;--mute:#A5A9D6;--gold:#FFC940;--gold2:#FF9F1C;--ok:#35E08A;--bad:#FF5A4E;
  --o0:#FF4F6D;--o1:#3D8BFF;--o2:#F5B700;--o3:#22C47A;
  --display:"Lalezar","Tajawal","Segoe UI",Tahoma,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  direction:rtl;font-family:var(--body);color:var(--ink);font-size:16px;
  background:
    radial-gradient(60% 45% at 18% 0%,rgba(255,201,64,.14),transparent 70%),
    radial-gradient(55% 40% at 85% 0%,rgba(46,230,200,.10),transparent 70%),
    radial-gradient(80% 60% at 50% 110%,rgba(255,107,138,.12),transparent 70%),
    var(--stage);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input{font-family:inherit}
[hidden]{display:none!important}
.disp{font-family:var(--display);font-weight:400}
.mute{color:var(--mute)}
.brand{font-family:var(--display);color:var(--gold);text-shadow:0 0 14px rgba(255,201,64,.5),0 3px 0 #8A5A00;font-size:clamp(34px,5vw,58px);line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:.3em;color:var(--mute);text-shadow:none;letter-spacing:.5px}
.btn{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#241800;font-weight:800;font-size:20px;padding:14px 26px;border-radius:16px;box-shadow:0 6px 0 #8A5A00,0 10px 30px rgba(255,201,64,.25)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #8A5A00}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 #0B0E2A;border:1.5px solid var(--line)}
.ghost{background:transparent;border:1.5px solid var(--line);padding:9px 14px;border-radius:999px;color:var(--mute);font-weight:700;font-size:15px}
.ghost:hover{border-color:var(--gold);color:var(--ink)}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c,#444);width:1.9em;height:1.9em;font-size:1em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);flex:none}
.av.off{filter:grayscale(1);opacity:.45}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,201,64,.12);color:var(--gold);border:1px solid rgba(255,201,64,.4);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}

/* ============ landing ============ */
.land{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;text-align:center}
.land .cards{display:grid;gap:14px;width:min(520px,100%)}
.land .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:right}
.land .card h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
.land .card p{margin:0;color:var(--mute);line-height:1.7}
.codein{display:flex;gap:8px}
.codein input{flex:1;min-width:0;font-size:24px;text-align:center;letter-spacing:6px;text-transform:uppercase;background:#0E1234;border:2px solid var(--line);border-radius:14px;color:var(--ink);padding:10px}

/* ============ host ============ */
.host{min-height:100%;display:flex;flex-direction:column;gap:14px;padding:14px clamp(14px,2.5vw,32px) 90px;max-width:1500px;margin:0 auto}
.lobby{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:26px;align-items:start;margin-top:10px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.joincard{background:#fff;color:#0A0C22;border-radius:26px;padding:22px;text-align:center;box-shadow:0 0 0 6px var(--gold),0 20px 60px rgba(0,0,0,.5)}
.joincard .qr svg{width:100%;height:auto;display:block}
.joincard .how{font-weight:800;font-size:20px;margin-top:8px}
.joincard .code{font-size:16px;color:#555;margin-top:6px}
.joincard .code b{font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:6px;color:#0A0C22;display:block;line-height:1.1;direction:ltr}
.joincard .url{font-size:13px;color:#777;direction:ltr;word-break:break-all;margin-top:4px}
.side h3{margin:4px 0 10px;font-size:20px;color:var(--mute);font-weight:800}
.plist{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;align-items:center}
.pchip{flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-weight:800;font-size:19px;animation:pop .4s}
.pchip .av{font-size:22px}
.pchip.hp{border-color:var(--gold)}
.pchip .x{background:none;color:var(--mute);font-size:18px;padding:0 6px}
.pchip .crownb{background:none;font-size:18px;padding:0 2px;opacity:.35}
.pchip.hp .crownb{opacity:1}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.empty{color:var(--mute);font-size:18px;padding:16px;border:2px dashed var(--line);border-radius:18px;width:100%}
.rchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.rchip{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:16px;color:var(--mute)}
.rchip.on{border-color:var(--gold);color:var(--ink);background:var(--panel2)}
.hint{color:var(--mute);line-height:1.7;margin:14px 0 0}
.net{position:fixed;bottom:10px;inset-inline-start:12px;font-size:13px;color:var(--mute);background:rgba(10,12,34,.8);padding:6px 10px;border-radius:10px;z-index:5}
.net.bad{color:var(--bad)}

.hbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hbar .brand{font-size:clamp(26px,3vw,38px)}
.rinfo{font-weight:800;font-size:clamp(16px,1.8vw,22px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:10px;background:#fff;color:#0A0C22;border-radius:14px;padding:6px 12px 6px 6px;font-weight:800}
.mini .qr{width:64px;height:64px}
.mini .qr svg{width:100%;height:100%}
.mini b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:3px;direction:ltr;display:block;line-height:1}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pod{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:12px 8px 8px;text-align:center;overflow:hidden}
.pod::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.pod .top{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:clamp(14px,1.5vw,18px);white-space:nowrap;overflow:hidden}
.pod .top .av{font-size:18px}
.pod .sc{font-family:var(--display);font-size:clamp(34px,4.2vw,54px);line-height:1;color:var(--c);margin-top:4px;font-variant-numeric:tabular-nums}
.pod.lead{border-color:var(--gold);box-shadow:0 0 22px rgba(255,201,64,.3)}
.pod .cr{position:absolute;top:6px;inset-inline-start:8px;font-size:18px}
.pod .done{position:absolute;top:6px;inset-inline-end:8px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#06210f;font-weight:900;display:grid;place-items:center;font-size:14px}
.pod .delta{direction:ltr;unicode-bidi:isolate;position:absolute;top:34%;inset-inline-end:10px;font-family:var(--display);font-size:30px;animation:floatup 1.6s forwards;pointer-events:none}
.pod .delta.p{color:var(--ok)}.pod .delta.n{color:var(--bad)}
@keyframes floatup{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-44px)}}
.pod.off{opacity:.5}

.stage{flex:1;position:relative;background:linear-gradient(180deg,#141949 0%,#0E1234 100%);border:2px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,40px);min-height:420px;display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.big-ico{font-size:clamp(70px,10vw,120px);line-height:1;animation:pop .5s}
.rtitle{font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,74px);line-height:1.15;margin:0;color:var(--gold)}
.lede{color:var(--ink);font-size:clamp(18px,2.2vw,28px);line-height:1.7;max-width:60ch;margin:0}
.qtext{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vw,60px);line-height:1.35;text-align:center;margin:0;text-wrap:balance}
.status{text-align:center;font-weight:800;font-size:clamp(20px,2.4vw,32px);min-height:1.4em}
.status .av{font-size:1.1em;vertical-align:middle}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:14px;background:var(--oc);border-radius:18px;padding:16px 18px;font-weight:800;font-size:clamp(20px,2.6vw,34px);min-height:84px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22);transition:opacity .3s,transform .3s}
.opt .sh{font-size:.9em;opacity:.9;width:1.3em;text-align:center;flex:none}
.opt .who{margin-inline-start:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.opt .who .av{font-size:18px;border:2px solid rgba(255,255,255,.7)}
.opt .cnt{margin-inline-start:auto;font-family:var(--display);font-size:1.1em}
.opt.dim{opacity:.22}
.opt.right{outline:5px solid #fff;transform:scale(1.03);opacity:1}
.opt.x::after{content:"✕";position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);font-size:1.3em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.c0{--oc:var(--o0)}.c1{--oc:var(--o1)}.c2{--oc:var(--o2)}.c3{--oc:var(--o3)}
.rowav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:48px}
.rowav .av{font-size:26px;transition:.3s}
.rowav .av.wait{opacity:.25;filter:grayscale(1)}
.rowav .av.lock{opacity:.35;filter:grayscale(1);position:relative}
.rowav .av.lock::after{content:"🔒";position:absolute;font-size:14px;bottom:-4px;left:-4px}
.tbar{position:relative;height:16px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tbar i{position:absolute;inset:0 0 0 auto;background:linear-gradient(90deg,var(--bad),var(--gold));border-radius:999px;transition:width .25s linear}
.tnum{position:absolute;top:-34px;inset-inline-start:0;font-family:var(--display);font-size:28px;color:var(--gold)}
.answer{font-family:var(--display);font-size:clamp(46px,7vw,96px);color:var(--ok);line-height:1.1;text-align:center;animation:pop .5s}
.list{display:flex;flex-direction:column;gap:10px;width:min(900px,100%);margin:0 auto}
.lrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:800;font-size:clamp(18px,2.2vw,28px)}
.lrow .av{font-size:24px}
.lrow .v{margin-inline-start:auto;font-family:var(--display);font-size:1.2em}
.lrow .d{direction:ltr;unicode-bidi:isolate;min-width:3em;text-align:center;font-family:var(--display);font-size:1.1em;color:var(--ok)}
.lrow.best{border-color:var(--gold);background:var(--panel2)}
.bars{display:flex;flex-direction:column;gap:12px;width:min(1000px,100%);margin:0 auto}
.bar{display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;gap:12px;align-items:center;font-weight:800;font-size:clamp(17px,2vw,26px)}
.bar .nm{display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap}
.bar .nm .av{font-size:22px}
.bar .track{height:38px;background:rgba(255,255,255,.06);border-radius:12px;overflow:hidden;position:relative}
.bar .fill{position:absolute;inset:0 0 0 auto;background:var(--c);border-radius:12px;transition:width .25s}
.bar .num{font-family:var(--display);font-size:1.3em;min-width:2.2em;text-align:center}
.bar .vot{display:flex;gap:3px;position:absolute;inset-inline-start:8px;top:50%;transform:translateY(-50%)}
.bar .vot .av{font-size:15px;border:2px solid rgba(255,255,255,.6)}
.fibopts{display:flex;flex-direction:column;gap:12px;width:min(1000px,100%);margin:0 auto}
.fibo{display:flex;align-items:center;gap:14px;background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:14px 18px;font-weight:800;font-size:clamp(20px,2.6vw,32px)}
.fibo .lt{font-family:var(--display);color:var(--gold);font-size:1.1em;width:1.4em;text-align:center}
.fibo .meta{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:.62em;color:var(--mute);flex-wrap:wrap;justify-content:flex-end}
.fibo .meta .av{font-size:20px}
.fibo.truth{border-color:var(--ok);background:rgba(53,224,138,.12)}
.fibo .own{color:var(--bad)}
.bomb{font-size:clamp(110px,16vw,200px);line-height:1;filter:drop-shadow(0 0 30px rgba(255,90,78,.6));animation:shake var(--sp,1s) infinite}
@keyframes shake{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.06)}}
.boom{font-size:clamp(140px,20vw,260px);animation:pop .4s}
.cd{font-family:var(--display);font-size:clamp(120px,18vw,240px);line-height:1;color:var(--gold);text-shadow:0 0 40px rgba(255,201,64,.6)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin-top:10px}
.pd{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:clamp(18px,2vw,26px)}
.pd .av{font-size:clamp(34px,4vw,54px)}
.pd .blk{width:clamp(90px,12vw,160px);border-radius:16px 16px 0 0;background:linear-gradient(180deg,var(--c),rgba(0,0,0,.2));display:grid;place-items:start center;padding-top:10px;font-family:var(--display);font-size:clamp(30px,4vw,52px)}
.punish{background:rgba(255,90,78,.12);border:2px dashed var(--bad);border-radius:18px;padding:14px 22px;font-size:clamp(18px,2.2vw,26px);font-weight:800;text-align:center}
.ctrlbar{position:fixed;bottom:0;inset-inline:0;display:flex;gap:10px;justify-content:center;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(10,12,34,.97) 60%,transparent);z-index:4;flex-wrap:wrap}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ============ phone ============ */
.ph{min-height:100%;min-height:100dvh;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));gap:12px;max-width:560px;margin:0 auto;user-select:none;-webkit-user-select:none}
.phead{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:8px 12px}
.phead .av{font-size:22px}
.phead .nm{font-weight:800;font-size:18px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.phead .sc{font-family:var(--display);font-size:28px;color:var(--c)}
.phead .rk{font-size:13px;color:var(--mute);font-weight:700}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.pbody .msg{font-size:22px;font-weight:800;line-height:1.6}
.pbody .ico{font-size:72px;line-height:1}
.pq{font-weight:800;font-size:19px;line-height:1.6;color:var(--ink);background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px}
.buzzer{align-self:center;width:min(78vw,340px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ff8a8a,#e5203a 60%,#9c0a1f);box-shadow:0 14px 0 #6d0614,0 24px 50px rgba(229,32,58,.5),inset 0 -10px 30px rgba(0,0,0,.25);font-family:var(--display);font-size:56px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .06s}
.buzzer:active,.buzzer.hit{transform:translateY(10px);box-shadow:0 4px 0 #6d0614,0 10px 30px rgba(229,32,58,.5)}
.popts{display:grid;gap:12px}
.popt{display:flex;align-items:center;gap:12px;background:var(--oc);border-radius:18px;padding:16px;font-weight:800;font-size:21px;min-height:70px;text-align:right;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22)}
.popt .sh{width:1.4em;text-align:center;flex:none}
.popt:active{transform:scale(.97)}
.pfield{font-size:28px;text-align:center;background:#0E1234;border:2px solid var(--line);border-radius:16px;color:var(--ink);padding:14px;width:100%}
.pfield:focus{outline:none;border-color:var(--gold)}
.plist2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:12px;font-weight:800;font-size:18px;text-align:right}
.pbtn .av{font-size:22px}
.pbtn.sel{border-color:var(--gold)}
.tapzone{flex:1;min-height:52vh;border-radius:28px;background:radial-gradient(circle at 50% 40%,var(--c),rgba(0,0,0,.35));display:grid;place-items:center;font-family:var(--display);font-size:90px;color:#fff;touch-action:none;box-shadow:inset 0 0 0 4px rgba(255,255,255,.15)}
.tapzone.pulse{animation:tp .12s}
@keyframes tp{50%{transform:scale(.97)}}
.stopbtn{align-self:center;width:min(78vw,320px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#7fffc0,#14b86a 60%,#07683b);box-shadow:0 14px 0 #05472a,0 24px 50px rgba(20,184,106,.45);font-family:var(--display);font-size:52px;color:#fff}
.stopbtn:active{transform:translateY(10px);box-shadow:0 4px 0 #05472a}
.pctrl{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;background:rgba(255,201,64,.1);border:1.5px solid rgba(255,201,64,.45);border-radius:18px;padding:10px}
.pctrl span{font-size:13px;color:var(--gold);font-weight:800;flex:none}
.pctrl .btn{flex:1;font-size:18px;padding:12px}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emojis button{font-size:30px;background:var(--panel);border:2px solid var(--line);border-radius:14px;aspect-ratio:1}
.emojis button.sel{border-color:var(--gold);background:var(--panel2)}
.ptimer{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.ptimer i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--gold));transition:width .25s linear;margin-inline-start:auto}
.res{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-size:80px;line-height:1}
.res.p{color:var(--ok)}.res.n{color:var(--bad)}.res.z{color:var(--mute)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;font-weight:800;padding:10px 16px;border-radius:12px;z-index:20;max-width:90vw;text-align:center;animation:pop .3s}
.connov{position:fixed;inset:0;background:rgba(10,12,34,.88);display:grid;place-items:center;z-index:15;text-align:center;padding:24px}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="lib/peerjs.min.js"></script>
<script src="lib/qrcode.js"></script>
<script>
/* =====================================================================
   ليلة التحدي — نسخة الجوالات
   الشاشة الكبيرة هي المضيف (تحفظ الحالة وتصحح)، وكل جوال يتصل بها مباشرة.
   ===================================================================== */
'use strict';

let AC = null, soundOn = true;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .15, type = 'sine', v = .18, t0 = 0) {
  if (!soundOn) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
  const t = a.currentTime + t0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d = .8, v = .4) {
  if (!soundOn) return; const a = ac(); if (!a) return;
  const len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let k = 0; k < len; k++) ch[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 2);
  const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = v;
  src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start();
}

/* =====================================================================
   طبقة الاتصال: PeerJS (حقيقي) أو BroadcastChannel (للتجربة على جهاز واحد)
   ===================================================================== */
function wrapPeerConn(c) {
  return {
    id: c.peer,
    send(o) { try { if (c.open) c.send(o); } catch (e) {} },
    onData(f) { c.on('data', f); },
    onClose(f) { let done = false; const g = () => { if (!done) { done = true; f(); } }; c.on('close', g); c.on('error', g); },
    close() { try { c.close(); } catch (e) {} }
  };
}
function mkLocalConn(bc, remote, self) {
  const ds = [], cs = []; let closed = false;
  return {
    id: remote,
    send(o) { if (!closed) bc.postMessage({to: remote, from: self, k: 'data', d: JSON.parse(JSON.stringify(o))}); },
    onData(f) { ds.push(f); }, onClose(f) { cs.push(f); },
    close() { if (closed) return; closed = true; bc.postMessage({to: remote, from: self, k: 'close'}); cs.forEach(f => f()); },
    _d(d) { if (!closed) ds.forEach(f => f(d)); }, _c() { if (!closed) { closed = true; cs.forEach(f => f()); } }
  };
}
const Net = {
  host(code, h) {
    if (NETMODE === 'local') {
      const bc = new BroadcastChannel(PREFIX + code), conns = {};
      bc.onmessage = e => {
        const m = e.data; if (m.to !== 'host') return;
        if (m.k === 'open') { const c = mkLocalConn(bc, m.from, 'host'); conns[m.from] = c; bc.postMessage({to: m.from, from: 'host', k: 'ack'}); h.conn(c); }
        else if (m.k === 'data') conns[m.from] && conns[m.from]._d(m.d);
        else if (m.k === 'close') { conns[m.from] && conns[m.from]._c(); delete conns[m.from]; }
      };
      setTimeout(() => h.status('ok'), 30); return;
    }
    let peer, pending = false;
    const start = () => {
      pending = false; h.status('starting');
      peer = new Peer(PREFIX + code, {debug: 0});
      peer.on('open', () => h.status('ok'));
      peer.on('connection', c => c.on('open', () => h.conn(wrapPeerConn(c))));
      peer.on('disconnected', () => { h.status('reconnect'); setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500); });
      peer.on('error', e => {
        if (e.type === 'unavailable-id') { h.status('busy'); pending = true; try { peer.destroy(); } catch (x) {} setTimeout(start, 4000); }
        else if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible'].includes(e.type)) { h.status('neterr'); }
      });
    };
    start();
    setInterval(() => { if (pending) return; if (peer && peer.destroyed) start(); else if (peer && peer.disconnected) { try { peer.reconnect(); } catch (e) {} } }, 8000);
  },
  join(code, h) {
    if (NETMODE === 'local') {
      const id = 'p' + Math.random().toString(36).slice(2, 9), bc = new BroadcastChannel(PREFIX + code); let c = null;
      bc.onmessage = e => { const m = e.data; if (m.to !== id) return;
        if (m.k === 'ack' && !c) { c = mkLocalConn(bc, 'host', id); h.open(c); }
        else if (m.k === 'data') c && c._d(m.d); else if (m.k === 'close') c && c._c(); };
      bc.postMessage({to: 'host', from: id, k: 'open'}); return;
    }
    const go = () => {
      const c = Net._pp.connect(PREFIX + code, {serialization: 'json', reliable: true});
      c.on('open', () => h.open(wrapPeerConn(c)));
    };
    const P = Net._pp;
    if (!P || P.destroyed) {
      const np = Net._pp = new Peer({debug: 0});
      np.on('error', e => { h.status(e.type === 'peer-unavailable' ? 'noroom' : 'neterr'); if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) { try { np.destroy(); } catch (x) {} } });
      np.on('disconnected', () => { try { if (!np.destroyed) np.reconnect(); } catch (e) {} });
      np.once('open', go);
    } else if (P.open) go(); else P.once('open', go);
  },
  _pp: null
};

  switch (v.scr) {
    case 'lobby': return `<div class="ico">🎉</div><div class="msg">أنت داخل!<br><span class="mute" style="font-size:17px">عدد اللاعبين ${AR(v.n)} · ${v.me.host ? 'أنت المقدّم، ابدأ لما يكتمل الكل' : 'ننتظر المقدّم يبدأ'}</span></div>`;
    case 'intro': return `<div class="ico">${v.icon}</div><span class="tag" style="align-self:center">الجولة ${AR(v.num)} من ${AR(v.of)}</span><div class="disp" style="font-size:40px;color:var(--gold)">${esc(v.name)}</div><div class="msg" style="font-size:17px;font-weight:600">${esc(v.desc)}</div>`;
    case 'msg': return `<div class="ico">${v.icon}</div><div class="msg">${esc(v.msg)}</div>`;
    case 'buzzer': return `<div class="pq">${esc(v.q)}</div><button class="buzzer" data-buzz>اضغط!</button><div class="mute">أول واحد يضغط يجاوب</div>`;
    case 'pick': return `${v.bomb ? '<div class="ico" style="font-size:54px">💣</div>' : v.hot ? '<div class="tag" style="align-self:center">🔔 أنت أول واحد! اختر بسرعة</div>' : ''}<div class="pq">${esc(v.q)}</div><div class="popts">${v.opts.map((o, i) => `<button class="popt c${i}" data-pick="${i}"><span class="sh">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    case 'num': return `<div class="pq">${esc(v.q)}</div><input class="pfield" inputmode="decimal" placeholder="تخمينك${v.unit ? ' (' + esc(v.unit) + ')' : ''}" autocomplete="off"><button class="btn" data-send="num">أرسل 🎯</button>`;
    case 'text': return `<div class="pq">${esc(v.q)}</div><input class="pfield" maxlength="40" placeholder="اكتب جواب كذب مقنع" autocomplete="off" style="font-size:22px"><button class="btn" data-send="lie">أرسل الكذبة 😏</button><div class="mute">لا تكتب الصح! خلّها تشبهه عشان تخدعهم</div>`;
    case 'choose': return `<div class="pq">${esc(v.q)}</div><div class="popts">${v.opts.map(o => `<button class="pbtn" data-choose="${o.i}">${esc(o.text)}</button>`).join('')}</div>`;
    case 'players': return `<div class="pq">${esc(v.q)}</div><div class="plist2">${v.list.map(p => `<button class="pbtn" data-who="${esc(p.k)}">${avatar(p)}<span>${esc(p.name)}</span></button>`).join('')}</div>`;
    case 'clock': return v.done ? `<div class="ico">✅</div><div class="msg">وقّفت العدّاد! ننتظر النتيجة</div>` : `<div class="msg">أوقف عند <span style="color:var(--gold)">${AR(v.target)}</span> ثواني</div><div class="disp" id="pcd" style="font-size:80px;color:var(--gold)"></div><button class="stopbtn" data-stop disabled>أوقف</button>`;
    case 'tap': return `<div class="disp" id="pcd" style="font-size:44px;color:var(--gold)"></div><div class="tapzone" data-tap style="--c:${v.me.color}"><span id="tapn">اهرس!</span></div>`;
    case 'result': { const d = v.delta; return `<div class="res ${d > 0 ? 'p' : d < 0 ? 'n' : 'z'}">${d ? SG(d) : '0'}</div><div class="msg">${d > 0 ? 'كفو! 🔥' : d < 0 ? 'أووه 😅' : 'ولا نقطة هالمرة'}</div><div class="pq">${esc(v.line)}</div>`; }
    case 'final': return `<div class="ico">${v.win ? '🏆' : v.last ? '😈' : '🎖️'}</div><div class="disp" style="font-size:38px;color:var(--gold)">${v.win ? 'أنت بطل الليلة!' : 'مركزك ' + AR(v.me.rank)}</div><div class="msg">مجموعك ${AR(v.me.score)} نقطة${v.win ? '' : '<br><span class="mute" style="font-size:17px">البطل: ' + esc(v.champ) + '</span>'}</div>${v.last && v.punish ? `<div class="punish">عقابك: ${esc(v.punish)}</div>` : ''}`;
  }
  return '';
}
function bindPhone() {
  const b = app;
  const nx = b.querySelector('[data-pa=next]'); if (nx) nx.onclick = () => { ac(); act('next'); nx.disabled = true; setTimeout(() => nx.disabled = false, 800); };
  const bz = b.querySelector('[data-buzz]');
  if (bz) bz.addEventListener('pointerdown', e => { e.preventDefault(); bz.classList.add('hit'); vib(40); act('buzz'); bz.textContent = '...'; }, {passive: false});
  b.querySelectorAll('[data-pick]').forEach(x => x.onclick = () => { act('ans', {i: +x.dataset.pick}); b.querySelectorAll('[data-pick]').forEach(y => y.disabled = true); x.style.outline = '4px solid #fff'; vib(30); });
  const sendBtn = b.querySelector('[data-send]');
  if (sendBtn) {
    const inp = b.querySelector('.pfield');
    const send = () => { const val = inp.value.trim(); if (!val) { inp.focus(); return; }
      if (sendBtn.dataset.send === 'num') { if (!isFinite(parseFloat(toLat(val)))) { toast('اكتب رقم'); return; } act('num', {v: toLat(val)}); }
      else act('lie', {s: val});
      sendBtn.disabled = true; setTimeout(() => sendBtn.disabled = false, 1500); };
    sendBtn.onclick = send; inp.onkeydown = e => { if (e.key === 'Enter') send(); };
  }
  b.querySelectorAll('[data-choose]').forEach(x => x.onclick = () => { act('vote', {i: +x.dataset.choose}); x.classList.add('sel'); b.querySelectorAll('[data-choose]').forEach(y => y.disabled = true); });
  b.querySelectorAll('[data-who]').forEach(x => x.onclick = () => { act(V.act === 'pass' ? 'pass' : 'who', {k: x.dataset.who}); x.classList.add('sel'); b.querySelectorAll('[data-who]').forEach(y => y.disabled = true); });
  const stop = b.querySelector('[data-stop]');
  if (stop) stop.addEventListener('pointerdown', e => { e.preventDefault(); const L = local['go' + V.go.id]; if (!L || performance.now() < L.goAt) return; const ms = performance.now() - L.goAt; act('stop', {ms: Math.round(ms)}); vib(50); stop.disabled = true; stop.textContent = '✓'; }, {passive: false});
  const tz = b.querySelector('[data-tap]');
  if (tz) tz.addEventListener('pointerdown', e => { e.preventDefault(); const L = local['go' + V.go.id]; if (!L) return; const t = performance.now(); if (t < L.goAt || t > L.goAt + V.dur) return; L.n++; $('#tapn').textContent = AR(L.n); tz.classList.remove('pulse'); void tz.offsetWidth; tz.classList.add('pulse'); }, {passive: false});
}
function phoneTick() {
  if (!V || pstat !== 'ok') return;
  if (V.timer) { const el = document.querySelector('.ptimer i'); if (el) { const left = Math.max(0, V.timer.left - (now() - V._at)); el.style.width = (100 * left / V.timer.total) + '%'; } }
  if (V.go) {
    const id = 'go' + V.go.id;
    if (!local[id]) local[id] = {goAt: performance.now() + Math.max(0, V.go.left), n: 0, sent: 0, lastSend: 0};
    const L = local[id], t = performance.now(), cd = document.getElementById('pcd');
    if (cd) { const l = L.goAt - t; cd.textContent = l > 0 ? AR(Math.ceil(l / 1000)) : (V.scr === 'tap' ? (t < L.goAt + V.dur ? AR(Math.ceil((L.goAt + V.dur - t) / 1000)) : '🏁') : '🤫'); }
    const stop = document.querySelector('[data-stop]'); if (stop && t >= L.goAt && stop.disabled && stop.textContent !== '✓') { stop.disabled = false; vib(80); }
    if (V.scr === 'tap' && L.n !== L.sent && t - L.lastSend > 200) { L.sent = L.n; L.lastSend = t; act('tap', {n: L.n}); }
  }
}

/* =====================================================================
   البداية

function landing() {
  const saved = lsGet(HKEY);
  const resumable = saved && saved.code && now() - (saved.t || 0) < 12 * 3600 * 1000;
  const pme = lsGet(PKEY);
  app.innerHTML = `<div class="land">
    <div class="brand">ليلة التحدي<small>لعبة عائلية · كل جوال يصير جرس</small></div>
    <div class="cards">
      <div class="card"><h2>📺 الشاشة الكبيرة</h2><p>افتحها على التلفزيون أو اللابتوب. يطلع باركود، وكل واحد يمسحه بجواله ويدخل.</p>
        <button class="btn" id="newroom">ابدأ غرفة جديدة</button>
        ${resumable ? `<button class="btn alt" id="resume">كمّل الغرفة ${esc(saved.code)}</button>` : ''}</div>
      <div class="card"><h2>📱 لاعب</h2><p>عندك رمز الغرفة؟ اكتبه هنا.</p>
        <div class="codein"><input id="code" maxlength="4" placeholder="رمز" value="${esc(pme && pme.code || '')}" autocomplete="off"><button class="btn" id="joinb">دخول</button></div></div>
    </div></div>`;
  $('#newroom').onclick = () => { ac(); startHost(genCode()); };
  if (resumable) $('#resume').onclick = () => { ac(); startHost(saved.code, saved); };
  const j = () => { const c = $('#code').value.trim().toUpperCase(); if (c.length >= 4) location.href = joinURL(c); };
  $('#joinb').onclick = j; $('#code').onkeydown = e => { if (e.key === 'Enter') j(); };
}
function genCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let k = 0; k < 4; k++) s += A[Math.floor(Math.random() * A.length)]; return s; }

app.addEventListener('click', e => { if (S) hostClick(e); });
document.addEventListener('keydown', e => { if (S && (e.code === 'Space' || e.key === 'Enter') && !e.target.closest('input,button')) { e.preventDefault(); next(); } });

if (NETMODE === 'peer' && typeof Peer === 'undefined') {
  app.innerHTML = '<div class="land"><div class="brand">ليلة التحدي</div><p>تعذّر تحميل مكتبة الاتصال. تأكد من الإنترنت وحدّث الصفحة.</p></div>';
} else if (params.get('r')) startPlayer(params.get('r'));
else if (params.get('host')) { const saved = lsGet(HKEY), c = params.get('host').toUpperCase(); startHost(c, saved && saved.code === c ? saved : null); }
else landing();
</script>
